[build-system]
requires = ["uv_build>=0.8.18,<0.12.0"]
build-backend = "uv_build"

[project]
name = "tradusquare_weblate"
version = "0.2.0"
description = "TraduSquare customization for a Weblate instance"
license = "GPL-3.0-or-later"
keywords = ["tradusquare", "i18n", "l10n", "translate"]
requires-python = ">=3.12"
dependencies = [
    "weblate==5.17.1",
]
